[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-rl-market-making"
version = "0.1.0"
description = "Extensions to mbt_gym for measuring a learned market maker against the closed form"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "gymnasium>=0.29",
    "torch>=2.0",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipykernel>=6.29", "notebook>=7.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
# the repo names its test modules testXxx.py, which pytest does not collect by default
python_files = ["test*.py"]
python_classes = ["test*", "Test*"]
pythonpath = ["src"]
